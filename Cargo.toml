[package]
name = "resolution-switcher"
version = "1.0.0"
edition = "2024"
description = "Switch resolution, refresh rate, orientation and scaling from hotkeyable slots."
repository = "https://github.com/nyedle/ResolutionSwitcher"
homepage = "https://github.com/nyedle/ResolutionSwitcher"
license = "MIT"
readme = "README.md"
keywords = ["display", "resolution", "monitor", "hotkey", "windows"]
categories = ["gui", "os::windows-apis"]
rust-version = "1.90"
exclude = ["/.github", "/installer", "/scripts", "/dist"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.24", default-features = false }
global-hotkey = "0.8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.31"
